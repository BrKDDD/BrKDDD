name: Update profile stats

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=BrKDDD&show_icons=true&hide_border=true&theme=github_dark&rank_icon=github&include_all_commits=true&disable_animations=true
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=BrKDDD&layout=compact&langs_count=8&hide_border=true&theme=github_dark&disable_animations=true
          fail_on_error: true

      - name: Commit refreshed cards
        shell: bash
        run: |
          if git diff --quiet -- profile/stats.svg profile/top-langs.svg; then
            echo "Stats are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "chore: refresh profile stats"
          git push
